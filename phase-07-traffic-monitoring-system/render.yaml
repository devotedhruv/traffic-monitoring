services:
  - type: web
    name: traffic-monitoring
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TRAFFIC_LIVE_IMAGE_SIZE
        value: "320"
      - key: TRAFFIC_LIVE_STREAM_WIDTH
        value: "640"
      - key: TRAFFIC_LIVE_STREAM_FPS
        value: "10"
      - key: TRAFFIC_LIVE_PREPROCESS_FILES
        value: "false"
      - key: TRAFFIC_ANALYSIS_FPS
        value: "10"
      - key: TRAFFIC_MAX_UPLOAD_MB
        value: "100"
      - key: TRAFFIC_AUTOSTART
        value: "true"