services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      TRAFFIC_VIDEO_SOURCE: ${TRAFFIC_VIDEO_SOURCE:-/data/traffic.mp4}
      TRAFFIC_VEHICLE_MODEL_PATH: ${TRAFFIC_VEHICLE_MODEL_PATH:-}
      TRAFFIC_MODEL_PATH: ${TRAFFIC_MODEL_PATH:-/app/models/yolo11s.pt}
      TRAFFIC_LIVE_MODEL_PATH: ${TRAFFIC_LIVE_MODEL_PATH:-/app/models/yolov8n.pt}
      TRAFFIC_LIVE_IMAGE_SIZE: ${TRAFFIC_LIVE_IMAGE_SIZE:-640}
      TRAFFIC_VEHICLE_CONFIDENCE: ${TRAFFIC_VEHICLE_CONFIDENCE:-0.10}
      TRAFFIC_LIVE_CONFIDENCE: ${TRAFFIC_LIVE_CONFIDENCE:-0.10}
      TRAFFIC_LIVE_STREAM_FPS: ${TRAFFIC_LIVE_STREAM_FPS:-15}
      TRAFFIC_LIVE_STREAM_WIDTH: ${TRAFFIC_LIVE_STREAM_WIDTH:-960}
      TRAFFIC_LIVE_TRACKER: ${TRAFFIC_LIVE_TRACKER:-/app/config/live_bytetrack.yaml}
      TRAFFIC_LIVE_PREPROCESS_FILES: ${TRAFFIC_LIVE_PREPROCESS_FILES:-true}
      TRAFFIC_LIVE_ACCURATE_FILE_MODE: ${TRAFFIC_LIVE_ACCURATE_FILE_MODE:-true}
      TRAFFIC_LIVE_FILE_ANALYSIS_FPS: ${TRAFFIC_LIVE_FILE_ANALYSIS_FPS:-2}
      TRAFFIC_LIVE_ROAD_PROFILE: ${TRAFFIC_LIVE_ROAD_PROFILE:-auto}
      TRAFFIC_LIVE_ROAD_POINTS: ${TRAFFIC_LIVE_ROAD_POINTS:-}
      TRAFFIC_LIVE_ROAD_WIDTH_METERS: ${TRAFFIC_LIVE_ROAD_WIDTH_METERS:-13}
      TRAFFIC_LIVE_ROAD_LENGTH_METERS: ${TRAFFIC_LIVE_ROAD_LENGTH_METERS:-50}
      TRAFFIC_LIVE_ROAD_CALIBRATION_QUALITY: ${TRAFFIC_LIVE_ROAD_CALIBRATION_QUALITY:-0.60}
      TRAFFIC_LIVE_MIN_SPEED_SAMPLES: ${TRAFFIC_LIVE_MIN_SPEED_SAMPLES:-2}
      TRAFFIC_LIVE_MIN_SPEED_CONFIDENCE: ${TRAFFIC_LIVE_MIN_SPEED_CONFIDENCE:-0.45}
      TRAFFIC_PLATE_MODEL_PATH: ${TRAFFIC_PLATE_MODEL_PATH:-}
      TRAFFIC_PLATE_OCR_ENGINE: ${TRAFFIC_PLATE_OCR_ENGINE:-tesseract}
      TRAFFIC_PLATE_OCR_LANGUAGES: ${TRAFFIC_PLATE_OCR_LANGUAGES:-nep+eng}
      TRAFFIC_PLATE_CONFIDENCE: ${TRAFFIC_PLATE_CONFIDENCE:-0.35}
      TRAFFIC_PLATE_MIN_QUALITY: ${TRAFFIC_PLATE_MIN_QUALITY:-0.18}
      TRAFFIC_PLATE_SAMPLE_SECONDS: ${TRAFFIC_PLATE_SAMPLE_SECONDS:-0.75}
      TRAFFIC_HELMET_MODEL_PATH: ${TRAFFIC_HELMET_MODEL_PATH:-}
      TRAFFIC_HELMET_CONFIDENCE: ${TRAFFIC_HELMET_CONFIDENCE:-0.35}
      TRAFFIC_LIVE_HELMET_CONFIDENCE: ${TRAFFIC_LIVE_HELMET_CONFIDENCE:-0.35}
      TRAFFIC_LIVE_HELMET_CONFIRMATIONS: ${TRAFFIC_LIVE_HELMET_CONFIRMATIONS:-3}
      TRAFFIC_LIVE_HELMET_SAMPLE_SECONDS: ${TRAFFIC_LIVE_HELMET_SAMPLE_SECONDS:-0.75}
      TRAFFIC_LIVE_LANE_RULES: ${TRAFFIC_LIVE_LANE_RULES:-}
      TRAFFIC_LIVE_ALLOWED_DIRECTION: ${TRAFFIC_LIVE_ALLOWED_DIRECTION:-both}
      TRAFFIC_LIVE_LANE_CONFIRMATIONS: ${TRAFFIC_LIVE_LANE_CONFIRMATIONS:-5}
      TRAFFIC_LIVE_LANE_GRACE_SECONDS: ${TRAFFIC_LIVE_LANE_GRACE_SECONDS:-1.0}
      TRAFFIC_LIVE_LANE_MIN_TRAJECTORY_SECONDS: ${TRAFFIC_LIVE_LANE_MIN_TRAJECTORY_SECONDS:-0.75}
      TRAFFIC_LIVE_LANE_MIN_DISTANCE_METERS: ${TRAFFIC_LIVE_LANE_MIN_DISTANCE_METERS:-1.0}
      TRAFFIC_TRACKER: ${TRAFFIC_TRACKER:-botsort.yaml}
      TRAFFIC_ANALYSIS_FPS: ${TRAFFIC_ANALYSIS_FPS:-15}
      TRAFFIC_DETECTOR_IMAGE_SIZE: ${TRAFFIC_DETECTOR_IMAGE_SIZE:-960}
      TRAFFIC_DATABASE_PATH: /data/traffic.db
      TRAFFIC_SPEED_LIMIT: ${TRAFFIC_SPEED_LIMIT:-50}
      TRAFFIC_METERS_PER_PIXEL: ${TRAFFIC_METERS_PER_PIXEL:-0.05}
      TRAFFIC_CAMERA_ID: ${TRAFFIC_CAMERA_ID:-camera-01}
      TRAFFIC_CAMERA_NAME: ${TRAFFIC_CAMERA_NAME:-North Junction}
      TRAFFIC_ALLOWED_ORIGINS: ${TRAFFIC_ALLOWED_ORIGINS:-http://localhost}
      TRAFFIC_MAX_UPLOAD_MB: ${TRAFFIC_MAX_UPLOAD_MB:-500}
      TRAFFIC_MAX_LINK_DURATION_MINUTES: ${TRAFFIC_MAX_LINK_DURATION_MINUTES:-120}
      TRAFFIC_ALLOWED_VIDEO_LINK_HOSTS: ${TRAFFIC_ALLOWED_VIDEO_LINK_HOSTS:-}
      TRAFFIC_AUTH_SESSION_HOURS: ${TRAFFIC_AUTH_SESSION_HOURS:-168}
      TRAFFIC_AUTH_COOKIE_SECURE: ${TRAFFIC_AUTH_COOKIE_SECURE:-false}
    volumes:
      - ./database:/data
      - ./videos/traffic.mp4:/data/traffic.mp4:ro
    expose:
      - "8000"

  frontend:
    build:
      context: frontend
      args:
        VITE_USE_MOCKS: "false"
        VITE_API_BASE_URL: ""
        VITE_WS_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${TRAFFICOPS_PORT:-8080}:80"
